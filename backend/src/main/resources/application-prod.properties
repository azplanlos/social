# Produktion (Zitadel + Cloudflare R2 + MongoDB Atlas)

# MongoDB
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:${MONGODB_URI:}}

# OIDC (Zitadel oder anderer OIDC-Provider)
spring.security.oauth2.resourceserver.jwt.issuer-uri=${OIDC_ISSUER_URI}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${OIDC_JWKS_URI}

# S3 (Cloudflare R2)
s3.endpoint=${S3_ENDPOINT}
s3.access-key=${S3_ACCESS_KEY}
s3.secret-key=${S3_SECRET_KEY}
s3.bucket=${S3_BUCKET:social}
s3.region=${S3_REGION:auto}

# CORS
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://mysocialapp.de}

# Server
server.use-forward-headers=true
